  <script type="text/babel" data-presets="env,react">
/* V1 — Procore-warm, V2 redesign.
   Same structure as v1-warm.jsx but with:
   - Honest framing: no fake pilot logos, no fabricated stats, no fake bio
   - Scroll engagement: peek, pain statements, scroll-linked anims, progress bar,

*/

const V1V2 = (() => {
  const C = {
    bg: "#F6F5F1",
    bg2: "#EDEBE4",
    ink: "#0F1419",
    sub: "#5B6470",
    line: "#E4E2DA",
    primary: "#D97757",
    primary2: "#B85A3D",
    primaryTint: "#F2DCD0",
    panel: "#FFFFFF",
    safe: "#16A34A",
    warn: "#D97706",
    sidebar: "#0F1419"
  };
  const SERIF = "'Fraunces', 'GT Pressura', Georgia, serif";
  const SANS = "'Geist', 'Söhne', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
  const U = (id, w = 900) => `https://images.unsplash.com/photo-${id}?w=${w}&q=80&auto=format&fit=crop`;

  // The artboard scrolls inside DesignCanvas — we read scroll progress
  // from the nearest scrollable ancestor instead of window.
  function useScrollRoot() {
    const [root, setRoot] = React.useState(null);
    const ref = React.useRef(null);
    React.useEffect(() => {
      let el = ref.current;
      while (el && el !== document.body) {
        const s = getComputedStyle(el);
        if (/(auto|scroll)/.test(s.overflowY)) {setRoot(el);return;}
        el = el.parentElement;
      }
      setRoot(window);
    }, []);
    return { ref, root };
  }

  // Run-once intersection observer: returns ref + a boolean that flips
  // true the first time the node crosses threshold, and stays true.
  function useReveal(threshold = 0.15) {
    const ref = React.useRef(null);
    const [seen, setSeen] = React.useState(false);
    React.useEffect(() => {
      if (!ref.current || seen) return;
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {setSeen(true);io.disconnect();}
          });
        },
        { threshold, root: findScrollParent(ref.current) }
      );
      io.observe(ref.current);
      return () => io.disconnect();
    }, [threshold, seen]);
    return [ref, seen];
  }

  function findScrollParent(node) {
    let el = node?.parentElement;
    while (el && el !== document.body) {
      const s = getComputedStyle(el);
      if (/(auto|scroll)/.test(s.overflowY)) return el;
      el = el.parentElement;
    }
    return null;
  }

  // Smooth count-up animation. Accepts string templates like "%23" or "₺ 142M"
  // — we only animate the digit run, leaving prefix/suffix untouched.
  function useCountUp(target, active, duration = 900) {
    const match = String(target).match(/^([^\d-]*)(-?[\d.,]+)(.*)$/);
    const [val, setVal] = React.useState(active ? target : match ? match[1] + "0" + match[3] : target);
    React.useEffect(() => {
      if (!active || !match) {setVal(target);return;}
      const pre = match[1],suf = match[3];
      const raw = match[2].replace(/\./g, "").replace(",", ".");
      const end = parseFloat(raw);
      const hasComma = match[2].includes(",");
      const decimals = hasComma ? match[2].split(",")[1]?.length || 0 : 0;
      const start = performance.now();
      let raf;
      const tick = (t) => {
        const p = Math.min(1, (t - start) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        const v = end * eased;
        const s = decimals ?
        v.toFixed(decimals).replace(".", ",") :
        Math.round(v).toLocaleString("tr-TR");
        setVal(pre + s + suf);
        if (p < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(raf);
    }, [target, active]);
    return val;
  }

  // Reveal wrapper — opacity 0→1 + translateY, with optional stagger delay.
  function Reveal({ children, delay = 0, dir = "up", threshold = 0.15, style }) {
    const [ref, seen] = useReveal(threshold);
    const offset = dir === "up" ? "24px" : dir === "left" ? "-32px" : dir === "right" ? "32px" : "0";

  // ----- Scroll progress bar (under nav, horizontal, 2px) -----
  function ScrollProgress() {
    const [p, setP] = React.useState(0);
    React.useEffect(() => {
      // find scrolling ancestor of the V2 root
      const root = document.querySelector("[data-v1v2-root]");
      const sp = findScrollParent(root) || window;
      const handler = () => {
        if (sp === window) {
          const h = document.documentElement.scrollHeight - window.innerHeight;
          setP(h > 0 ? window.scrollY / h : 0);
        } else {
          const h = sp.scrollHeight - sp.clientHeight;
          setP(h > 0 ? sp.scrollTop / h : 0);
        }
      };
      sp.addEventListener("scroll", handler, { passive: true });
      handler();
      return () => sp.removeEventListener("scroll", handler);
    }, []);
    return (
      <div style={{
        position: "sticky", top: 73, zIndex: 4, height: 2, background: "transparent",
        marginTop: -2
      }}>
        <div style={{
          height: 2, width: `${p * 100}%`,
          background: `linear-gradient(90deg,${C.primary} 0%,${C.primary2} 100%)`,
          transition: "width 80ms linear"
        }} />
      </div>);

  function scrollTo(id) {
    const el = document.getElementById(id);

    const sp = findScrollParent(el) || window;
    const headerOffset = 72;
    if (sp === window) {

      window.scrollTo({ top, behavior: "smooth" });

      const top = el.getBoundingClientRect().top - sp.getBoundingClientRect().top + sp.scrollTop - headerOffset;

    }

      <section id="iletisim" style={{ padding: "100px 56px 80px", background: C.ink, color: C.bg }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 64 }}>
          <Reveal>
            <div>
              <div style={{
                fontFamily: SANS, fontSize: 12.5, fontWeight: 600, letterSpacing: 1.4,
                textTransform: "uppercase", color: C.primary, marginBottom: 18
              }}>{t.contact_eyebrow}</div>
              <h2 style={{
                fontFamily: SERIF, fontSize: 56, fontWeight: 500, lineHeight: 1.02,
                letterSpacing: -1.6, color: C.bg, margin: 0
              }}>{t.contact_title}</h2>
              <p style={{
                fontFamily: SANS, fontSize: 17, lineHeight: 1.6,
                color: "rgba(247,244,237,.7)", marginTop: 22, maxWidth: 480
              }}>{t.contact_body}</p>

              {/* Response promise — replaces the old bare contact lines */}
              <div style={{
                marginTop: 36, display: "inline-flex", alignItems: "center", gap: 10,
                padding: "8px 14px", borderRadius: 999,
                background: "rgba(249,115,22,.14)", color: C.primary,
                fontFamily: SANS, fontSize: 12.5, fontWeight: 700,
                letterSpacing: 1.2, textTransform: "uppercase",
              }}>
                {lang === "tr"
                  ? "1 iş günü içinde geri dönüyoruz · Türkçe / İngilizce"
                  : "We reply within 1 business day · TR / EN"}
              </div>

              {/* Channels grid */}
              <div style={{
                marginTop: 32, paddingTop: 32, borderTop: "1px solid rgba(247,244,237,.15)",
                display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 18,
              }}>
                {channels.map((c) => (
                  <Reveal key={c.k}>
                    <div style={{
                      display: "flex", alignItems: "flex-start", gap: 12,
                    }}>
                      <span style={{
                        width: 36, height: 36, borderRadius: 8, flex: "0 0 auto",
                        background: "rgba(247,244,237,.08)", color: C.primary,
                        display: "inline-flex", alignItems: "center", justifyContent: "center",
                      }}><ChannelGlyph kind={c.kind} /></span>
                      <div style={{ display: "flex", flexDirection: "column", lineHeight: 1.3 }}>
                        <span style={{
                          fontFamily: SANS, fontSize: 11, fontWeight: 700, letterSpacing: 1.2,
                          textTransform: "uppercase", color: "rgba(247,244,237,.55)",
                        }}>{c.k}</span>
                        <span style={{ fontFamily: SANS, fontSize: 15, color: C.bg, marginTop: 4, fontWeight: 500 }}>{c.v}</span>
                        <span style={{ fontFamily: SANS, fontSize: 12.5, color: "rgba(247,244,237,.55)", marginTop: 4 }}>{c.s}</span>
                      </div>
                    </div>
                  </Reveal>
                ))}
              </div>
            </div>
          </Reveal>
          <Reveal dir="right">
            <form
              onSubmit={(e) => {
                e.preventDefault();
                const fd = new FormData(e.currentTarget);
                const name = (fd.get("name") || "").toString().trim();
                const company = (fd.get("company") || "").toString().trim();
                const email = (fd.get("email") || "").toString().trim();
                const role = (fd.get("role") || "").toString().trim();
                const message = (fd.get("message") || "").toString().trim();
                const subject = lang === "tr"
                  ? `BuildingAI demo isteği — ${company || name || "isim yok"}`
                  : `BuildingAI demo request — ${company || name || "unnamed"}`;
                const labels = lang === "tr"
                  ? { name: "Ad Soyad", company: "Firma", email: "E-posta", role: "Rol", message: "Mesaj" }
                  : { name: "Name",     company: "Company", email: "Email",    role: "Role", message: "Message" };
                const body = [
                  `${labels.name}: ${name}`,
                  `${labels.company}: ${company}`,
                  `${labels.email}: ${email}`,
                  `${labels.role}: ${role}`,
                  "",
                  `${labels.message}:`,
                  message,
                ].join("\n");
                window.location.href =
                  `mailto:buildingartificialintelligence@gmail.com` +
                  `?subject=${encodeURIComponent(subject)}` +
                  `&body=${encodeURIComponent(body)}`;
              }}
              style={{ background: C.bg, color: C.ink, padding: 36, borderRadius: 4 }}
            >
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Field name="name"    label={t.contact_name}    required />
                <Field name="company" label={t.contact_company} />
                <Field name="email"   type="email" label={t.contact_email} full required />
                <Select name="role"   label={t.contact_role} opts={t.contact_role_opts} full />
                <Field name="message" label={t.contact_message} ta full />
              </div>
              <button type="submit" style={{
                marginTop: 18, width: "100%",
                background: C.primary, color: "#FFF", border: "none",
                padding: "16px 24px", borderRadius: 4,
                fontFamily: SANS, fontSize: 16, fontWeight: 600, cursor: "pointer"
              }}>{t.contact_send} →</button>
              <div style={{
                marginTop: 14, fontFamily: SANS, fontSize: 12, color: C.sub, textAlign: "center",
              }}>
                {lang === "tr"
                  ? <>Formu göndermek e-posta uygulamanızı açar · veya doluya <a href="mailto:buildingartificialintelligence@gmail.com" style={{ color: C.primary2, textDecoration: "underline" }}>buildingartificialintelligence@gmail.com</a> yazın.</>
                  : <>Submitting opens your email app · or write to <a href="mailto:buildingartificialintelligence@gmail.com" style={{ color: C.primary2, textDecoration: "underline" }}>buildingartificialintelligence@gmail.com</a> directly.</>}
              </div>
            </form>
          </Reveal>
        </div>

      </section>);
  }

  // Small monoline glyphs for the contact channels.
  function ChannelGlyph({ kind, size = 18 }) {
    const common = {
      width: size, height: size, viewBox: "0 0 24 24", fill: "none",
      stroke: "currentColor", strokeWidth: 1.6,
      strokeLinecap: "round", strokeLinejoin: "round",
    };
    if (kind === "email") {
      return (
        <svg {...common}>
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 7l9 6 9-6" />
        </svg>
      );
    }
    if (kind === "instagram") {
      return (
        <svg {...common}>
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none" />
        </svg>
      );
    }
    if (kind === "whatsapp") {
      return (
        <svg {...common}>
          <path d="M21 12a9 9 0 1 1-3.6-7.2L21 4l-1 3.6A9 9 0 0 1 21 12z" />
          <path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-.9 1.5 1 -.9 1.4 c-3.8 .2-7.4-2.7-7.5-6.5L8 9l1.5-.9 1 1.5 -.9 1.2" />
        </svg>
      );
    }
    if (kind === "linkedin") {
      return (
        <svg {...common}>
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7" />
        </svg>
      );
    }
    if (kind === "pilot") {
      return (
        <svg {...common}>
          <path d="M3 21h18" />
          <path d="M5 21V10l7-5 7 5v11" />
          <path d="M10 21v-6h4v6" />
          <path d="M16 7l-4 -3" />
        </svg>
      );
    }
    return null;
  }

  function Line({ label, v }) {
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        <span style={{
          width: 30, height: 30, borderRadius: 999, background: "rgba(247,244,237,.1)",
          display: "flex", alignItems: "center", justifyContent: "center", color: C.primary
        }}>{label}</span>
        <span style={{ color: C.bg }}>{v}</span>
      </div>);

  }
  function Field({ label, full, ta, name, type = "text", required = false }) {
    const id = React.useId();
    return (
      <div style={{ gridColumn: full ? "1 / -1" : "auto" }}>
        <label htmlFor={id} style={{
          fontFamily: SANS, fontSize: 12, color: C.sub, fontWeight: 600,
          letterSpacing: 0.4, textTransform: "uppercase", display: "block", marginBottom: 6
        }}>{label}{required && <span style={{ color: C.primary2, marginLeft: 4 }}>*</span>}</label>
        {ta ?
        <textarea id={id} name={name} required={required} rows="3" aria-label={label} style={{
          width: "100%", padding: "12px 14px", border: `1px solid ${C.line}`,
          borderRadius: 4, fontFamily: SANS, fontSize: 15, color: C.ink,
          resize: "none", background: "#FAF7F1", outline: "none", boxSizing: "border-box"
        }} /> :
        <input id={id} name={name} type={type} required={required} aria-label={label} style={{
          width: "100%", padding: "12px 14px", border: `1px solid ${C.line}`,
          borderRadius: 4, fontFamily: SANS, fontSize: 15, color: C.ink,
          background: "#FAF7F1", outline: "none", boxSizing: "border-box"
        }} />}
      </div>);

  }
  function Select({ label, opts, full, name }) {
    const id = React.useId();
    return (
      <div style={{ gridColumn: full ? "1 / -1" : "auto" }}>
        <label htmlFor={id} style={{
          fontFamily: SANS, fontSize: 12, color: C.sub, fontWeight: 600,
          letterSpacing: 0.4, textTransform: "uppercase", display: "block", marginBottom: 6
        }}>{label}</label>
        <select id={id} name={name} aria-label={label} style={{
          width: "100%", padding: "12px 14px", border: `1px solid ${C.line}`,
          borderRadius: 4, fontFamily: SANS, fontSize: 15, color: C.ink,
          background: "#FAF7F1", outline: "none", boxSizing: "border-box"
        }}>{opts.map((o) => <option key={o}>{o}</option>)}</select>
      </div>);

  }

  // ===================== FOOTER =====================
  function Footer({ lang }) {
    const t = I18N[lang];
    return (
      <footer style={{
        padding: "56px 56px 36px", background: C.ink, color: "rgba(247,244,237,.7)",
        borderTop: "1px solid rgba(247,244,237,.1)", fontFamily: SANS, fontSize: 14
      }}>
        <div style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr 1fr 1fr", gap: 32 }}>
          <div>
            <Wordmark ink={C.bg} dark />
            <p style={{ marginTop: 14, fontSize: 14, lineHeight: 1.55, maxWidth: 320 }}>{t.footer_tag}</p>
          </div>
          {[
          [t.footer_product, lang === "tr" ?
          ["Saha & İlerleme", "Maliyet & Hakediş", "Kalite & Güvenlik", "Türkiye Uyum", "Yapay Zeka"] :
          ["Field & Progress", "Cost & Payments", "Quality & Safety", "Türkiye Compliance", "AI"]],
          [t.footer_company, lang === "tr" ?
          ["Pilot programı", "Kariyer", "İletişim"] :
          ["Pilot program", "Careers", "Contact"]],
          [t.footer_resources, lang === "tr" ?
          ["Yönetmelik kütüphanesi", "Whitepaper", "Blog", "Destek"] :
          ["Code library", "Whitepaper", "Blog", "Support"]]].
          map(([h, items]) =>
          <div key={h}>
              <div style={{ color: C.bg, fontWeight: 600, marginBottom: 14 }}>{h}</div>
              {items.map((i) => <div key={i} style={{ marginBottom: 8 }}>{i}</div>)}
            </div>
          )}
        </div>
        <div style={{
          marginTop: 40, paddingTop: 22, borderTop: "1px solid rgba(247,244,237,.1)",
          display: "flex", justifyContent: "space-between", fontSize: 13
        }}>
          <span>{t.footer_rights}</span>
          <div style={{ display: "flex", gap: 22 }}>
            <span>{t.footer_privacy}</span>
            <span>{t.footer_terms}</span>
            <span>{t.footer_kvkk}</span>
          </div>
        </div>
      </footer>);

  }

  // ===================== ROOT =====================
  function V1V2Page() {
    const { lang, setLang } = useLang("tr");
    return (
      <div data-v1v2-root style={{
        background: C.bg, color: C.ink, fontFamily: SANS, position: "relative"
      }}>
        <style>{`
          @keyframes pulseDot {
            0% { transform: scale(1); opacity: 1; }
            80% { transform: scale(2.6); opacity: 0; }
            100% { transform: scale(2.6); opacity: 0; }
          }
          @keyframes dotBlink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
          @keyframes bridgeBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }
          }
        `}</style>
        <Nav lang={lang} setLang={setLang} />
        <ScrollProgress />
        <Hero lang={lang} />
        <Pillars lang={lang} />
        <DeepDives lang={lang} />
        <AISpotlight lang={lang} />
        <ModulesGrid lang={lang} />
        <Pricing lang={lang} />
        <Integrations lang={lang} />
        <Contact lang={lang} />
        <Footer lang={lang} />
      </div>);

  }

  return { V1V2Page };
})();

window.V1V2Page = V1V2.V1V2Page;
  </script>
  <script type="text/babel" data-presets="env,react">
    ReactDOM.createRoot(document.getElementById('root')).render(<V1V2Page />);
    requestAnimationFrame(() => {
      const s = document.getElementById('splash');
      if (s) { s.classList.add('fade'); setTimeout(() => s.remove(), 500); }
    });
  </script>
</body>
</html>
